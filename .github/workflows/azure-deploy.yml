# Build Laravel (composer + Vite) rồi deploy lên Azure App Service mỗi lần push lên nhánh main
name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, intl, dom

      - name: Tạo thư mục storage (Git không lưu thư mục rỗng)
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache

      - name: Composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Đóng gói
        run: |
          rm -rf node_modules tests .git
          rm -f bootstrap/cache/*.php
          zip -qr release.zip . -x ".env" "storage/logs/*" "storage/framework/sessions/*" "storage/framework/views/*" "storage/framework/cache/data/*" "dataset demo SQL/*"

      - name: Deploy lên Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
